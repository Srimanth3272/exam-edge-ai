<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Affairs Mock Test - ExamEdge</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <style>
    .mock-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .mock-header {
      background: var(--bg-card);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 24px;
      text-align: center;
      position: relative;
    }
    .mock-header h1 {
      color: var(--primary);
      margin-bottom: 8px;
    }
    .mock-header p {
      color: var(--text-secondary);
    }
    .back-btn {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }
    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .option-btn {
      text-align: left;
      padding: 14px 20px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
      display: flex;
      align-items: center;
    }
    .option-btn:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.05);
    }
    .option-btn.correct {
      background: rgba(16, 185, 129, 0.1);
      border-color: #10b981;
      color: #10b981;
    }
    .option-btn.incorrect {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
      color: #ef4444;
    }
    .option-btn.disabled {
      pointer-events: none;
      opacity: 0.8;
    }
    .explanation-box {
      display: none;
      background: var(--bg-primary);
      border-left: 4px solid var(--primary);
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-top: 16px;
    }
    .explanation-box.visible {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    .explanation-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .explanation-text {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-line;
    }
    .loading-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body class="light-mode">
  <div class="mock-container">
    <div class="mock-header">
      <a href="index.html" class="back-btn">← Back</a>
      <h1>International Affairs</h1>
      <p>Interactive Mock Test • Generated from PDF</p>
    </div>
    
    <div id="questionsContainer">
      <div class="loading-state">
        <p>Loading questions...</p>
      </div>
    </div>
  </div>

  <script src="mock-test.js"></script>
</body>
</html>
